name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Harness regression tests
        run: python -B .agents/scripts/test_session_start.py
      - name: Public repository and provenance checks
        run: python -B .agents/scripts/check_repository.py
      - name: Baseline release refusal boundaries
        run: python -B .agents/scripts/test_package_release.py
  product:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Pinned development dependencies
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Environment creation failed.' }
          & .venv/Scripts/python.exe -m pip install -r requirements-dev.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
      - name: Build and release package refusal guards
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Excel, DXF, Tk drop regression and release Windows build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-dev.ps1 -Release
